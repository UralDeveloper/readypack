<script>
(() => {
  const h = document.getElementById('v5h'), b = h.querySelector('.v5h__burger'), m = document.getElementById('v5-menu');
  const set = open => { b.setAttribute('aria-expanded', open); m.hidden = !open; h.classList.toggle('is-open', open); document.documentElement.classList.toggle('v5-lock', open); };
  b.addEventListener('click', () => set(b.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', e => { if (e.key === 'Escape' && !m.hidden) { set(false); b.focus(); } });
  m.addEventListener('click', e => { if (e.target.closest('a')) set(false); });
  const sc = () => h.classList.toggle('is-scrolled', scrollY > 8);
  addEventListener('scroll', sc, {passive: true}); sc();
})();
</script>
