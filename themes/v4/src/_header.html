<script>
(() => {
  const h = document.getElementById('v4h'), b = h.querySelector('.v4-burger'), m = document.getElementById('v4-menu');
  const sc = () => h.classList.toggle('is-scrolled', scrollY > 24);
  addEventListener('scroll', sc, {passive: true}); sc();
  const set = o => { b.setAttribute('aria-expanded', o); m.hidden = !o; h.classList.toggle('is-open', o); };
  b.addEventListener('click', () => set(m.hidden));
  addEventListener('keydown', e => { if (e.key === 'Escape' && !m.hidden) { set(false); b.focus(); } });
})();
</script>
